# Benchmark
number_of_macros_to_place: 128
grid: 256
# Trainer
max_episodes: 1000
population_size: 5
elite_count: 1
buffer_capacity: 5
update_frontiers_begin: 20
update_frontiers_freq: 2
solution_pool_size: 10
solution_pool_alpha: 0.1
layer_crossover_normalize_coefficient: 2
layer_crossover_begin: 5
layer_crossover_interval: 5
layer_crossover_prob: 0.2
layer_rollback_threshold: 0.1
# Environment
rank_mode: 1
wiremask_scale: 10000.0
reward_scale: 1000.0
# Agent
actor_learning_rate: 0.0004
critic_learning_rate: 0.001
actor_learning_rate_anneal_rate: 0.9999
critic_learning_rate_anneal_rate: 0.9999
maximum_gradient_normalization: 0.5
entropy_coefficient: 0.001
clip_epsilon: 0.2
gamma: 1.0
lambda: 0.98
ppo_epoch: 5
ppo_batch_size: 128